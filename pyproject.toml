[project]
name = "butterfly-mlops-coursework"
version = "0.1.0"
description = "Reproducible image classification experiments for the MLOps coursework"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24,<2; python_version < '3.9'",
    "numpy>=2,<3; python_version >= '3.9'",
    "scipy>=1.10,<1.11; python_version < '3.9'",
    "scipy>=1.12,<2; python_version >= '3.9'",
    "scikit-learn>=1.3,<1.4; python_version < '3.9'",
    "scikit-learn>=1.4,<2; python_version >= '3.9'",
    "pillow>=10.4,<11; python_version < '3.9'",
    "pillow>=11,<13; python_version >= '3.9'",
    "joblib>=1.4,<1.5; python_version < '3.9'",
    "joblib>=1.4,<2; python_version >= '3.9'",
]
